<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Page not found | URL Shortener</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 440px);
        padding: 40px 32px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        background: #fff;
        text-align: center;
        box-shadow: 0 12px 36px rgb(15 23 42 / 7%);
      }

      .code {
        margin: 0;
        color: #2563eb;
        font-size: 64px;
        font-weight: 750;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #64748b;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>URL not found</h1>
      <p>We couldn't find the page or short link you were looking for.</p>
    </main>
  </body>
</html>
